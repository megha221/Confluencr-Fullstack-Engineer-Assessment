services:
  - type: web
    name: transaction-webhook
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: transaction-db
          property: connectionString
      - key: PROCESS_DELAY_SECONDS
        value: "30"
      - key: WORKER_POLL_SECONDS
        value: "1"

databases:
  - name: transaction-db
    plan: free
    databaseName: transactions
    user: transactions
